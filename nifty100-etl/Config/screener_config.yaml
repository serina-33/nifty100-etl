# Sprint 3 — analyst-editable screener configuration
filters:
  roe_min: 15
  de_max: 1.0
  fcf_min: 0
  revenue_cagr_5yr_min: 10
  pat_cagr_5yr_min: 20
  opm_min: 15
  pe_max: 20
  pb_max: 3.0
  dividend_yield_min: 1
  icr_min: 3
  market_cap_min: 5000
  net_profit_min: 500
  eps_cagr_min: 10
  asset_turnover_min: 0.5
  sales_min: 5000

presets:
  Quality Compounder:
    roe_min: 15
    de_max: 1.0
    fcf_min: 0
    revenue_cagr_5yr_min: 10
  Value Pick:
    pe_max: 20
    pb_max: 3.0
    de_max: 2.0
    dividend_yield_min: 1
  Growth Accelerator:
    pat_cagr_5yr_min: 20
    revenue_cagr_5yr_min: 15
    de_max: 2.0
  Dividend Champion:
    dividend_yield_min: 2
    dividend_payout_max: 80
    fcf_min: 0
  Debt-Free Blue Chip:
    de_max: 0
    roe_min: 12
    sales_min: 5000
  Turnaround Watch:
    revenue_cagr_3yr_min: 10
    fcf_latest_positive: true
    de_declining_yoy: true

composite_weights:
  profitability:
    roe: 0.15
    roce: 0.10
    npm: 0.10
  cash_quality:
    fcf_cagr_5yr: 0.15
    cfo_pat_ratio: 0.10
    fcf_positive: 0.05
  growth:
    revenue_cagr_5yr: 0.10
    pat_cagr_5yr: 0.10
  leverage:
    de_score: 0.10
    icr_score: 0.05

peer_metrics:
  - roe
  - roce
  - net_profit_margin
  - debt_to_equity
  - free_cash_flow
  - pat_cagr_5yr
  - revenue_cagr_5yr
  - eps_cagr_5yr
  - interest_coverage
  - asset_turnover

radar_metrics:
  - roe
  - roce
  - npm
  - de
  - fcf_score
  - pat_cagr_5yr
  - revenue_cagr_5yr
  - composite_score

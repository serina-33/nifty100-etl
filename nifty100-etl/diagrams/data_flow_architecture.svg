<svg width="680" height="200" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Data flow from user action to analytics dashboard</title>
<desc>Frontend to backend API to database to ETL pipeline to analytics dashboard</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.box { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.75; }
.box2 { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }
.box3 { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.75; }
.title { font-size: 14px; font-weight: bold; fill: #0C447C; }
.title2 { font-size: 14px; font-weight: bold; fill: #085041; }
.title3 { font-size: 14px; font-weight: bold; fill: #712B13; }
.sub { font-size: 12px; fill: #185FA5; }
.sub2 { font-size: 12px; fill: #0F6E56; }
.sub3 { font-size: 12px; fill: #993C1D; }
.caption { font-size: 12px; fill: #444; }
line { stroke: #5F5E5A; stroke-width: 1; }
</style>

<rect class="box" x="20" y="70" width="118" height="56" rx="8"/>
<text class="title" x="79" y="94" text-anchor="middle">Frontend</text>
<text class="sub" x="79" y="112" text-anchor="middle">User clicks, submits</text>

<line x1="138" y1="98" x2="176" y2="98" marker-end="url(#arrow)"/>

<rect class="box2" x="176" y="70" width="118" height="56" rx="8"/>
<text class="title2" x="235" y="94" text-anchor="middle">Backend API</text>
<text class="sub2" x="235" y="112" text-anchor="middle">Auth, validation</text>

<line x1="294" y1="98" x2="332" y2="98" marker-end="url(#arrow)"/>

<rect class="box2" x="332" y="70" width="118" height="56" rx="8"/>
<text class="title2" x="391" y="94" text-anchor="middle">Database</text>
<text class="sub2" x="391" y="112" text-anchor="middle">Stores the record</text>

<line x1="450" y1="98" x2="488" y2="98" marker-end="url(#arrow)"/>

<rect class="box3" x="488" y="70" width="80" height="56" rx="8"/>
<text class="title3" x="528" y="94" text-anchor="middle">ETL</text>
<text class="sub3" x="528" y="112" text-anchor="middle">Pipeline</text>

<line x1="568" y1="98" x2="606" y2="98" marker-end="url(#arrow)"/>

<rect class="box3" x="606" y="55" width="66" height="86" rx="8"/>
<text class="title3" x="639" y="94" text-anchor="middle">Dash-</text>
<text class="title3" x="639" y="110" text-anchor="middle">board</text>

<text class="caption" x="340" y="160" text-anchor="middle">Logging and error handling wrap every stage of this pipeline</text>
</svg>
